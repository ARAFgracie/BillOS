<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BillOS — Bills</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="layout.css">
<script src="layout.js" defer></script>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .topbar{
    will-change:transform;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px;
    background:linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.45));
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    border-bottom:1px solid rgba(255,255,255,0.6);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.9), 0 4px 20px rgba(34,197,94,0.06);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .logo{
    width:38px; height:38px; background:linear-gradient(135deg, var(--blue), #34D399);
    border-radius:11px; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:17px;
  }
  .brand-name{ font-size:18px; font-weight:800; }
  .back-link{ font-size:13px; color:var(--blue); font-weight:700; text-decoration:none; }

  .content{ padding:20px 18px 40px; max-width:1000px; margin:0 auto; }
  .content h1{ font-size:21px; margin:0 0 16px; }

  /* ---------- Two-column layout: bills left, lookup right ---------- */
  .layout-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
  @media (max-width:820px){
    .layout-grid{ grid-template-columns:1fr; }
  }

  .col-title{ font-size:13px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:0.3px; margin-bottom:10px; }

  .bills-list-scroll{ max-height:640px; overflow-y:auto; padding-right:2px; }

  .bill-card{ border-radius:16px; padding:15px; margin-bottom:9px; cursor:pointer; transition:box-shadow 0.15s ease, border-color 0.15s ease; }
  .bill-card:hover{ box-shadow:0 4px 16px rgba(34,197,94,0.12); }
  .bill-card.selected{ border:1.5px solid var(--blue); }
  .bill-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:7px; }
  .bill-id{ font-size:12px; color:var(--muted); font-weight:700; }
  .status-badge{
    background:rgba(220,252,231,0.9); color:var(--green);
    font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:20px; text-transform:capitalize;
  }
  .bill-amount{ font-size:21px; font-weight:800; margin-bottom:5px; }
  .bill-meta{ font-size:11.5px; color:var(--muted); display:flex; gap:12px; }

  .empty-card{ border-radius:16px; padding:24px; text-align:center; }
  .empty-icon{ font-size:30px; margin-bottom:8px; }
  .empty-title{ font-weight:800; font-size:15px; margin-bottom:4px; }
  .empty-sub{ font-size:13px; color:var(--muted); }

  /* ---------- Lookup / receipt panel ---------- */
  .lookup-card{ border-radius:18px; padding:18px; position:sticky; top:16px; }
  @media (max-width:820px){ .lookup-card{ position:static; } }
  .lookup-title{ font-size:15px; font-weight:800; margin-bottom:3px; }
  .lookup-sub{ font-size:12px; color:var(--muted); margin-bottom:14px; }
  .lookup-row{ display:flex; gap:8px; margin-bottom:6px; }
  .lookup-row input{
    flex:1; padding:12px 14px; border-radius:12px; border:1.5px solid var(--border);
    background:rgba(127,127,127,0.05); color:var(--ink);
    font-size:15px; outline:none; text-transform:uppercase;
  }
  .lookup-row input:focus{ border-color:var(--blue); }
  .lookup-row button{
    padding:0 18px; border:none; border-radius:12px;
    background:var(--blue); color:#fff; font-weight:800; font-size:13.5px; cursor:pointer;
  }
  .lookup-msg{ font-size:12.5px; padding:8px 10px; border-radius:10px; margin-bottom:4px; display:none; }
  .lookup-msg.error{ display:block; background:rgba(220,38,38,0.12); color:var(--error); }
  .lookup-empty{ text-align:center; color:var(--muted); font-size:13px; padding:36px 10px; }
  .receipt-loading{ text-align:center; color:var(--muted); font-size:13px; padding:24px 10px; }

  .receipt{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--border); }
  .receipt-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
  .receipt-id{ font-weight:800; font-size:14px; }
  .receipt-date{ font-size:11.5px; color:var(--muted); margin-top:2px; text-transform:capitalize; }
  .receipt-items{ margin-bottom:10px; }
  .receipt-item{ display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .receipt-item:last-child{ border-bottom:none; }
  .ri-name{ font-weight:700; }
  .ri-meta{ font-size:11px; color:var(--muted); margin-top:2px; }
  .ri-total{ font-weight:800; white-space:nowrap; }
  .receipt-total{
    display:flex; justify-content:space-between; align-items:center;
    font-weight:800; font-size:16px; padding-top:10px; margin-top:4px; border-top:1px solid var(--border);
  }
  .edit-bill-btn{
    width:100%; margin-top:16px; padding:13px 0; border:none; border-radius:14px;
    background:linear-gradient(135deg, var(--blue), #22C55E); color:#fff;
    font-weight:800; font-size:14.5px; cursor:pointer;
  }

  .loading{ text-align:center; padding:60px 20px; color:var(--muted); }
</style>
</head>
<body>

<div id="loading" class="loading">Loading BillOS...</div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="brand">
      <div class="logo">B</div>
      <div class="brand-name">BillOS</div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <a href="dashboard.html" class="back-link">← Dashboard</a>
      <div class="theme-switcher">
        <div class="theme-toggle glass" id="theme-toggle" onclick="toggleThemeMenu()">🎨</div>
        <div class="theme-menu glass" id="theme-menu"></div>
      </div>
    </div>
  </div>

  <div class="content">
    <h1>Recent Bills</h1>

    <div class="layout-grid">
      <!-- LEFT: recent bill cards -->
      <div>
        <div class="col-title">All Bills</div>
        <div class="bills-list-scroll">
          <div id="bills-list"></div>
        </div>
      </div>

      <!-- RIGHT: paste a code, see the full digital receipt, edit it -->
      <div class="lookup-card glass">
        <div class="lookup-title">Find a Bill</div>
        <div class="lookup-sub">Paste a bill code (or tap one on the left) to see everything that was in it.</div>
        <div class="lookup-row">
          <input type="text" id="code-input" placeholder="e.g. D19501BE" autocomplete="off">
          <button type="button" id="code-search-btn">View</button>
        </div>
        <div class="lookup-msg" id="lookup-msg"></div>
        <div id="receipt-area">
          <div class="lookup-empty">No bill selected yet.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://ektdcnvraluuwxmqhjvj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_yTDG8ujXgVE81BNAvPvZlw_tlbfKNTm";
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  window.sb = sb;

  let allBills = [];

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }

    const { data: profile, error } = await sb
      .from('profiles')
      .select('shop_id')
      .eq('id', session.user.id)
      .single();

    if (error || !profile) {
      document.getElementById('loading').textContent = 'Could not load your profile.';
      return;
    }

    await loadBills(profile.shop_id);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    document.getElementById('code-search-btn').addEventListener('click', () => {
      showReceiptForCode(document.getElementById('code-input').value);
    });
    document.getElementById('code-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        showReceiptForCode(e.target.value);
      }
    });
  }

  async function loadBills(shopId) {
    const container = document.getElementById('bills-list');
    const { data, error } = await sb
      .from('invoices')
      .select('id, total_amount, payment_method, created_at')
      .eq('shop_id', shopId)
      .order('created_at', { ascending: false })
      .limit(50);

    if (error) {
      container.innerHTML = '<div class="empty-card glass empty-sub">Could not load bills.</div>';
      return;
    }
    allBills = data || [];
    if (!allBills.length) {
      container.innerHTML = '<div class="empty-card glass"><div class="empty-icon">🧾</div><div class="empty-title">No bills yet</div><div class="empty-sub">Completed sales will show up here.</div></div>';
      return;
    }
    container.innerHTML = allBills.map(inv => {
      const shortId = inv.id.slice(0, 8).toUpperCase();
      const date = new Date(inv.created_at).toLocaleString('en-GB', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
      return `
        <div class="bill-card glass" id="card-${shortId}" onclick="lookupCode('${shortId}')">
          <div class="bill-top">
            <div class="bill-id">#${shortId}</div>
            <div class="status-badge">completed</div>
          </div>
          <div class="bill-amount">৳${Number(inv.total_amount).toFixed(2)}</div>
          <div class="bill-meta"><span>${(inv.payment_method || 'cash')}</span><span>${date}</span></div>
        </div>
      `;
    }).join('');
  }

  window.lookupCode = function(code) {
    document.getElementById('code-input').value = code;
    showReceiptForCode(code);
  };

  function markSelectedCard(code) {
    document.querySelectorAll('.bill-card').forEach(el => el.classList.remove('selected'));
    const el = document.getElementById('card-' + code);
    if (el) el.classList.add('selected');
  }

  async function showReceiptForCode(codeRaw) {
    const code = (codeRaw || '').trim().toUpperCase();
    const msg = document.getElementById('lookup-msg');
    const area = document.getElementById('receipt-area');

    if (!code) {
      msg.textContent = 'Enter a bill code first.';
      msg.className = 'lookup-msg error';
      return;
    }

    const bill = allBills.find(b => b.id.slice(0, 8).toUpperCase() === code);
    if (!bill) {
      msg.textContent = 'No bill found with that code in the last 50 bills.';
      msg.className = 'lookup-msg error';
      area.innerHTML = '<div class="lookup-empty">No bill selected yet.</div>';
      return;
    }

    msg.className = 'lookup-msg';
    msg.textContent = '';
    markSelectedCard(code);
    area.innerHTML = '<div class="receipt-loading">Loading receipt...</div>';

    const { data: items, error } = await sb
      .from('invoice_items')
      .select('product_id, quantity, unit_price, line_total, products(name, unit)')
      .eq('invoice_id', bill.id);

    if (error) {
      area.innerHTML = '<div class="lookup-msg error" style="display:block;">Could not load items for this bill.</div>';
      return;
    }

    const lineItems = (items || []).map(it => ({
      productId: it.product_id,
      qty: Number(it.quantity),
      name: it.products?.name || 'Unknown item',
      unit: it.products?.unit || '',
      unitPrice: Number(it.unit_price),
      lineTotal: Number(it.line_total)
    }));

    renderReceipt(bill, lineItems);
  }

  function renderReceipt(bill, items) {
    const area = document.getElementById('receipt-area');
    const code = bill.id.slice(0, 8).toUpperCase();
    const date = new Date(bill.created_at).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });

    area.innerHTML = `
      <div class="receipt">
        <div class="receipt-head">
          <div>
            <div class="receipt-id">#${code}</div>
            <div class="receipt-date">${date} · ${bill.payment_method || 'cash'}</div>
          </div>
          <div class="status-badge">completed</div>
        </div>
        <div class="receipt-items">
          ${items.length ? items.map(it => `
            <div class="receipt-item">
              <div>
                <div class="ri-name">${it.name}</div>
                <div class="ri-meta">${it.qty} ${it.unit} × ৳${it.unitPrice.toFixed(2)}</div>
              </div>
              <div class="ri-total">৳${it.lineTotal.toFixed(2)}</div>
            </div>
          `).join('') : '<div class="lookup-empty" style="padding:12px 0;">No item details found for this bill.</div>'}
        </div>
        <div class="receipt-total"><span>Total</span><span>৳${Number(bill.total_amount).toFixed(2)}</span></div>
        <button type="button" class="edit-bill-btn" id="edit-bill-btn">✎ Edit This Bill in Billing</button>
      </div>
    `;

    document.getElementById('edit-bill-btn').addEventListener('click', () => editThisBill(bill, items));
  }

  function editThisBill(bill, items) {
    const msg = document.getElementById('lookup-msg');
    const cartData = items.filter(i => i.productId).map(i => ({ productId: i.productId, qty: i.qty }));

    if (!cartData.length) {
      msg.textContent = 'No items found to load into Billing.';
      msg.className = 'lookup-msg error';
      return;
    }

    sessionStorage.setItem('billos-resume-cart', JSON.stringify({ invoiceId: bill.id, items: cartData }));
    window.location.href = 'billing.html?resume=1';
  }

  init();
</script>

</body>
</html>
