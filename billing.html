<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BillOS — Billing</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<link rel="stylesheet" href="layout.css">
<script src="layout.js" defer></script>
<style>
  :root{
    --blue:#22C55E;
    --blue-dark:#16A34A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom:100px;
  }
  .topbar{
    will-change:transform;
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px;
    background:linear-gradient(180deg, rgba(255,255,255,0.75), rgba(255,255,255,0.45));
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    border-bottom:1px solid rgba(255,255,255,0.6);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.9), 0 4px 20px rgba(34,197,94,0.06);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .logo{
    width:40px; height:40px; background:var(--blue); border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:18px;
  }
  .brand-name{ font-size:19px; font-weight:800; }
  .back-link{ font-size:13px; color:var(--blue); font-weight:700; text-decoration:none; }

  .content{ padding:20px; max-width:600px; margin:0 auto; }
  .content h1{ font-size:22px; margin:0 0 4px; }
  .sub{ font-size:13px; color:var(--muted); margin-bottom:14px; }

  .search{
    width:100%; padding:14px 16px; margin-bottom:8px;
    border-radius:14px; border:1.5px solid rgba(34,197,94,0.5);
    background:linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0.3));
    backdrop-filter:blur(16px) saturate(150%);
    -webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.8);
    font-size:16px; outline:none;
  }
  .hint{ font-size:11.5px; color:var(--muted); margin-bottom:16px; }
  .hint b{ color:var(--blue); }

  .row-head{
    display:flex; justify-content:space-between;
    font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase;
    padding:0 4px; margin-bottom:6px;
  }

  .item-row{
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border:1px solid var(--border); border-radius:14px;
    padding:12px 14px; margin-bottom:8px;
  }
  .item-row.just-added{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(34,197,94,0.15); }
  .i-name{ font-weight:700; font-size:14px; }
  .i-meta{ font-size:11.5px; color:var(--muted); margin-top:2px; }
  .i-right{ display:flex; align-items:center; gap:10px; }
  .qty-input{
    width:56px; padding:7px 4px; border-radius:10px; border:1px solid var(--border);
    font-size:16px; text-align:center; font-weight:700; outline:none;
  }
  .qty-input:focus{ border-color:var(--blue); box-shadow:0 0 0 3px rgba(34,197,94,0.15); }
  .i-total{ font-weight:800; font-size:14px; min-width:56px; text-align:right; }
  .remove-btn{
    width:28px; height:28px; border-radius:8px; border:none;
    background:#FEECEC; color:#DC2626; font-size:14px; cursor:pointer;
  }
  .discount-tag{
    display:inline-block; background:rgba(34,197,94,0.15); color:var(--blue);
    font-size:9.5px; font-weight:800; padding:1px 6px; border-radius:10px; margin-left:4px;
  }

  .empty-card{
    background:#fff; border:1px dashed var(--border); border-radius:14px;
    padding:28px; text-align:center; color:var(--muted); font-size:13px;
  }

  .cart-bar{
    will-change:transform;
    position:fixed; bottom:0; left:0; right:0;
    background:linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0.5));
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    border-top:1px solid rgba(255,255,255,0.6);
    padding:14px 20px;
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.9), 0 -8px 32px rgba(26,29,41,0.12);
  }
  .cart-row{ display:flex; justify-content:space-between; align-items:center; max-width:600px; margin:0 auto; }
  .cart-info{ font-size:13px; color:var(--muted); }
  .cart-total{ font-size:20px; font-weight:800; }
  .charge-btn{
    background:var(--blue); color:#fff; border:none; border-radius:14px;
    padding:14px 26px; font-weight:800; font-size:15px; cursor:pointer;
  }
  .charge-btn:disabled{ opacity:.5; cursor:not-allowed; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(26,29,41,0.5);
    display:none; align-items:flex-end; justify-content:center; z-index:10;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:#fff; border-radius:20px 20px 0 0; padding:24px 20px 28px;
    width:100%; max-width:600px;
  }
  .modal h3{ margin:0 0 16px; }
  .pay-options{ display:flex; gap:10px; margin-bottom:20px; }
  .pay-opt{
    flex:1; text-align:center; padding:12px 0; border-radius:12px;
    border:1.5px solid rgba(0,0,0,0.08); font-weight:700; font-size:14px; cursor:pointer; color:var(--muted);
    background:linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0.25));
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
  }
  .pay-opt.selected{
    border-color:var(--blue); color:var(--blue);
    background:linear-gradient(180deg, rgba(238,241,252,0.85), rgba(238,241,252,0.5));
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.9);
  }
  .confirm-btn{
    width:100%; padding:14px 0; border:none; border-radius:14px;
    background:var(--green); color:#fff; font-weight:800; font-size:15px; cursor:pointer;
  }
  .cancel-link{ display:block; text-align:center; margin-top:12px; color:var(--muted); font-size:13px; }
  .msg{ margin-top:12px; font-size:13px; padding:10px; border-radius:10px; display:none; }
  .msg.error{ display:block; background:#FEECEC; color:#DC2626; }
  .msg.success{ display:block; background:#E7F8EE; color:#16A34A; }

  .loading{ text-align:center; padding:60px 20px; color:var(--muted); }
  .toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:8px 16px; border-radius:20px;
    font-size:12.5px; font-weight:600; opacity:0; transition:opacity .2s; z-index:30;
  }
  .toast.show{ opacity:1; }

  /* ---------- Hold button (cart bar) ---------- */
  .hold-btn{
    background:rgba(127,127,127,0.12); color:var(--ink); border:1px solid var(--border);
    border-radius:12px; padding:10px 14px; font-weight:700; font-size:13px; cursor:pointer;
    display:flex; align-items:center; gap:6px;
  }
  .hold-badge{
    background:var(--blue); color:#fff; font-size:10px; font-weight:800;
    border-radius:10px; padding:1px 6px; min-width:16px; text-align:center;
  }

  /* ---------- Hold panel (slide-in from right) ---------- */
  .hold-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(3px);
    display:none; z-index:25;
  }
  .hold-overlay.open{ display:block; }
  .hold-panel{
    position:fixed; top:0; right:0; bottom:0; width:100%; max-width:400px;
    background:var(--card); border-left:1px solid var(--border);
    display:flex; flex-direction:column;
    transform:translateX(100%); transition:transform 0.25s ease;
  }
  .hold-overlay.open .hold-panel{ transform:translateX(0); }
  .hold-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px; border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .hold-header h3{ margin:0; font-size:16px; }
  .hold-close{
    width:30px; height:30px; border-radius:8px; border:none;
    background:rgba(127,127,127,0.12); color:var(--ink); font-size:14px; cursor:pointer;
  }
  .hold-body{ flex:1; min-height:0; overflow-y:auto; padding:16px 20px; }

  .hold-current-box{
    border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:20px;
    background:rgba(34,197,94,0.06);
  }
  .hold-current-box .label{ font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; margin-bottom:8px; }
  .hold-folder-row{ display:flex; gap:8px; margin-bottom:8px; }
  .hold-folder-row input, .hold-folder-row select{
    flex:1; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:rgba(127,127,127,0.06); color:var(--ink); font-size:13px; outline:none;
  }
  .hold-btn-confirm{
    width:100%; padding:11px 0; border:none; border-radius:12px;
    background:var(--blue); color:#fff; font-weight:800; font-size:13.5px; cursor:pointer;
  }
  .hold-btn-confirm:disabled{ opacity:0.5; cursor:not-allowed; }

  .hold-folder-group{ margin-bottom:16px; }
  .hold-folder-title{ font-size:12.5px; font-weight:800; color:var(--blue); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.3px; }
  .held-bill-row{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--border); border-radius:12px; padding:11px 13px; margin-bottom:8px;
  }
  .held-bill-info .hb-meta{ font-size:11px; color:var(--muted); }
  .held-bill-info .hb-amount{ font-weight:800; font-size:14px; }
  .held-bill-actions{ display:flex; gap:6px; }
  .hb-resume-btn{
    background:var(--blue); color:#fff; border:none; border-radius:9px;
    padding:7px 12px; font-weight:700; font-size:12px; cursor:pointer;
  }
  .hb-delete-btn{
    background:rgba(220,38,38,0.12); color:var(--error); border:none; border-radius:9px;
    width:30px; font-weight:700; font-size:12px; cursor:pointer;
  }
  .hold-empty{ text-align:center; color:var(--muted); font-size:13px; padding:30px 10px; }
</style>
</head>
<body>

<div id="loading" class="loading">Loading BillOS...</div>
<div class="toast" id="toast"></div>

<div id="app" style="display:none;">
  <div class="topbar">
    <div class="brand">
      <div class="logo">B</div>
      <div class="brand-name">BillOS</div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <a href="dashboard.html" class="back-link">← Dashboard</a>
      <div class="theme-switcher">
        <div class="theme-toggle glass" id="theme-toggle" onclick="toggleThemeMenu()">🎨</div>
        <div class="theme-menu glass" id="theme-menu"></div>
      </div>
    </div>
  </div>

  <div class="content">
    <h1>New Bill</h1>
    <div class="sub">Type a product code or name, then press Enter to add</div>
    <input type="text" class="search" id="search" placeholder="Scan or type product code / name..." autocomplete="off">
    <div class="hint">Press <b>F1 twice</b> to edit the quantity of the last added item, then press Enter to confirm.</div>

    <div id="row-head-wrap"></div>
    <div id="product-list"></div>
  </div>

  <div class="cart-bar">
    <div class="cart-row">
      <button class="hold-btn" id="hold-open-btn" title="Hold bill (Ctrl+H)">
        ⏸ Hold <span class="hold-badge" id="hold-badge" style="display:none;">0</span>
      </button>
      <div class="cart-info" id="cart-info">0 items</div>
      <div class="cart-total" id="cart-total">৳0</div>
      <button class="charge-btn" id="charge-btn" disabled>Charge</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>Complete Bill — <span id="modal-total"></span></h3>
    <div class="pay-options">
      <div class="pay-opt selected" data-method="cash">Cash</div>
      <div class="pay-opt" data-method="card">Card</div>
    </div>
    <button class="confirm-btn" id="confirm-btn">Confirm Payment</button>
    <div class="msg" id="charge-msg"></div>
    <a href="#" class="cancel-link" id="cancel-link">Cancel</a>
  </div>
</div>

<div class="hold-overlay" id="hold-overlay">
  <div class="hold-panel">
    <div class="hold-header">
      <h3>Held Bills</h3>
      <button class="hold-close" id="hold-close-btn">✕</button>
    </div>
    <div class="hold-body">
      <div class="hold-current-box" id="hold-current-box" style="display:none;">
        <div class="label">Hold Current Bill</div>
        <div class="hold-folder-row">
          <select id="hold-folder-select"></select>
        </div>
        <div class="hold-folder-row">
          <input type="text" id="hold-folder-new" placeholder="Or type a new folder name...">
        </div>
        <button class="hold-btn-confirm" id="hold-confirm-btn">Hold This Bill</button>
      </div>

      <div id="held-bills-list"></div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://ektdcnvraluuwxmqhjvj.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_yTDG8ujXgVE81BNAvPvZlw_tlbfKNTm";
  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let profile = null;
  let products = [];
  let cart = {};       // productId -> { product, qty }
  let cartOrder = [];  // ordered list of productIds, most recent last
  let selectedPayment = 'cash';
  let lastF1Time = 0;
  let heldBills = [];  // held_bills rows for this shop
  let discounts = [];  // active/scheduled discounts for this shop

  async function loadDiscounts() {
    const { data } = await sb
      .from('discounts')
      .select('*')
      .eq('shop_id', profile.shop_id)
      .eq('is_active', true);
    discounts = data || [];
  }

  function getActiveDiscount(productId) {
    const now = new Date();
    return discounts.find(d => {
      if (d.product_id && d.product_id !== productId) return false;
      const starts = new Date(d.starts_at);
      const ends = new Date(d.ends_at);
      return now >= starts && now <= ends;
    }) || null;
  }

  function getUnitPrice(product) {
    const discount = getActiveDiscount(product.id);
    if (!discount) return product.price;
    if (discount.discount_type === 'percentage') {
      return Math.max(0, product.price * (1 - discount.discount_value / 100));
    }
    return Math.max(0, product.price - discount.discount_value);
  }

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = 'login.html'; return; }

    const { data: p, error } = await sb
      .from('profiles')
      .select('id, full_name, role, shop_id')
      .eq('id', session.user.id)
      .single();

    if (error || !p) {
      document.getElementById('loading').textContent = 'Could not load your profile.';
      return;
    }
    profile = p;

    await loadProducts();
    await loadHeldBills();
    await loadDiscounts();

    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('search').focus();

    if (new URLSearchParams(window.location.search).get('hold') === '1') {
      openHoldPanel();
    }
  }

  async function loadProducts() {
    const { data } = await sb
      .from('products')
      .select('*')
      .eq('shop_id', profile.shop_id)
      .not('code', 'is', null)
      .neq('code', '')
      .order('name');
    products = data || [];
    renderCart();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1200);
  }

  // ---------- Search + Enter to add ----------
  function findProduct(query) {
    const q = query.trim().toLowerCase();
    if (!q) return null;
    // Exact code match first
    let match = products.find(p => (p.code || '').toLowerCase() === q);
    if (match) return match;
    // Fallback: name contains query, only if exactly one match
    const nameMatches = products.filter(p => p.name.toLowerCase().includes(q));
    if (nameMatches.length === 1) return nameMatches[0];
    return null;
  }

  document.getElementById('search').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const input = e.target;
    const query = input.value;
    const product = findProduct(query);

    if (!product) {
      showToast('No matching product found');
      return;
    }

    if (cart[product.id]) {
      cart[product.id].qty += 1;
    } else {
      cart[product.id] = { product, qty: 1 };
      cartOrder = cartOrder.filter(id => id !== product.id);
    }
    // Move to end (most recent)
    cartOrder = cartOrder.filter(id => id !== product.id);
    cartOrder.push(product.id);

    input.value = '';
    renderCart(product.id);
    input.focus();
  });

  // ---------- F1 double-press to edit last item's quantity ----------
  document.addEventListener('keydown', (e) => {
    if (e.key === 'F1') {
      e.preventDefault();
      const now = Date.now();
      if (now - lastF1Time < 500) {
        // Double press detected
        const lastId = cartOrder[cartOrder.length - 1];
        if (lastId) {
          const qtyInput = document.getElementById('qty-' + lastId);
          if (qtyInput) {
            qtyInput.focus();
            qtyInput.select();
          }
        }
        lastF1Time = 0;
      } else {
        lastF1Time = now;
      }
    }
  });

  // ---------- Render cart rows ----------
  function renderCart(justAddedId) {
    const container = document.getElementById('product-list');
    const headWrap = document.getElementById('row-head-wrap');

    if (!cartOrder.length) {
      headWrap.innerHTML = '';
      container.innerHTML = '<div class="empty-card">No items yet. Type a product code and press Enter to start the bill.</div>';
      updateCartBar();
      return;
    }

    headWrap.innerHTML = '<div class="row-head"><span>Item</span><span>Qty · Total</span></div>';

    container.innerHTML = cartOrder.map(id => {
      const entry = cart[id];
      if (!entry) return '';
      const p = entry.product;
      const discount = getActiveDiscount(p.id);
      const unitPrice = getUnitPrice(p);
      const lineTotal = (entry.qty * unitPrice).toFixed(2);
      const justAdded = id === justAddedId ? ' just-added' : '';
      const priceMeta = discount
        ? `#${p.code || '—'} · <span style="text-decoration:line-through;opacity:0.6;">৳${p.price}</span> ৳${unitPrice.toFixed(2)}/${p.unit} <span class="discount-tag">🏷️ ${discount.name}</span>`
        : `#${p.code || '—'} · ৳${p.price}/${p.unit}`;
      return `
        <div class="item-row${justAdded}">
          <div>
            <div class="i-name">${p.name}</div>
            <div class="i-meta">${priceMeta}</div>
          </div>
          <div class="i-right">
            <input type="number" min="0" step="${p.is_weighted ? '0.01' : '1'}" class="qty-input" id="qty-${id}" value="${entry.qty}"
              onkeydown="handleQtyKeydown(event, '${id}')" onchange="updateQty('${id}', this.value)">
            <div class="i-total">৳${lineTotal}</div>
            <button class="remove-btn" onclick="removeItem('${id}')">✕</button>
          </div>
        </div>
      `;
    }).join('');

    updateCartBar();
  }

  window.handleQtyKeydown = function(e, id) {
    if (e.key === 'Enter') {
      e.preventDefault();
      updateQty(id, e.target.value);
      document.getElementById('search').focus();
    }
  };

  window.updateQty = function(id, value) {
    const entry = cart[id];
    if (!entry) return;
    let qty = parseFloat(value);
    if (!entry.product.is_weighted) qty = Math.round(qty);
    if (!qty || qty <= 0) {
      delete cart[id];
      cartOrder = cartOrder.filter(x => x !== id);
    } else {
      entry.qty = Math.round(qty * 100) / 100;
    }
    renderCart();
  };

  window.removeItem = function(id) {
    delete cart[id];
    cartOrder = cartOrder.filter(x => x !== id);
    renderCart();
  };

  // ============================================================
  // Hold / Park Bill system
  // ============================================================
  const holdOverlay = document.getElementById('hold-overlay');

  async function loadHeldBills() {
    const { data } = await sb
      .from('held_bills')
      .select('*')
      .eq('shop_id', profile.shop_id)
      .order('created_at', { ascending: false });
    heldBills = data || [];
    updateHoldBadge();
  }

  function updateHoldBadge() {
    const badge = document.getElementById('hold-badge');
    if (heldBills.length > 0) {
      badge.textContent = heldBills.length;
      badge.style.display = 'inline-block';
    } else {
      badge.style.display = 'none';
    }
  }

  function folderOptionsHtml() {
    const folders = [...new Set(heldBills.map(h => h.folder_name))];
    if (!folders.length) return '<option value="">— No folders yet —</option>';
    return '<option value="">Select existing folder...</option>' +
      folders.map(f => `<option value="${f}">${f}</option>`).join('');
  }

  function renderHoldPanel() {
    const hasCartItems = cartOrder.length > 0;
    document.getElementById('hold-current-box').style.display = hasCartItems ? 'block' : 'none';
    document.getElementById('hold-folder-select').innerHTML = folderOptionsHtml();
    document.getElementById('hold-folder-new').value = '';

    const listEl = document.getElementById('held-bills-list');
    if (!heldBills.length) {
      listEl.innerHTML = '<div class="hold-empty">No held bills. Bills you hold will appear here, grouped by folder.</div>';
      return;
    }

    const folders = [...new Set(heldBills.map(h => h.folder_name))];
    listEl.innerHTML = folders.map(folder => {
      const rows = heldBills.filter(h => h.folder_name === folder);
      const rowsHtml = rows.map(h => `
        <div class="held-bill-row">
          <div class="held-bill-info">
            <div class="hb-amount">৳${Number(h.total_amount).toFixed(2)}</div>
            <div class="hb-meta">${h.item_count} item${h.item_count !== 1 ? 's' : ''} · ${new Date(h.created_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}</div>
          </div>
          <div class="held-bill-actions">
            <button class="hb-resume-btn" onclick="resumeHeldBill('${h.id}')">Resume</button>
            <button class="hb-delete-btn" onclick="deleteHeldBill('${h.id}')">✕</button>
          </div>
        </div>
      `).join('');
      return `
        <div class="hold-folder-group">
          <div class="hold-folder-title">📁 ${folder}</div>
          ${rowsHtml}
        </div>
      `;
    }).join('');
  }

  window.openHoldPanel = function() {
    renderHoldPanel();
    holdOverlay.classList.add('open');
  };
  window.closeHoldPanel = function() {
    holdOverlay.classList.remove('open');
  };

  document.getElementById('hold-open-btn').addEventListener('click', openHoldPanel);
  document.getElementById('hold-close-btn').addEventListener('click', closeHoldPanel);
  holdOverlay.addEventListener('click', (e) => {
    if (e.target === holdOverlay) closeHoldPanel();
  });

  document.getElementById('hold-confirm-btn').addEventListener('click', async () => {
    const items = cartOrder.map(id => cart[id]).filter(Boolean);
    if (!items.length) return;

    const newFolder = document.getElementById('hold-folder-new').value.trim();
    const selectedFolder = document.getElementById('hold-folder-select').value;
    const folderName = newFolder || selectedFolder;

    if (!folderName) {
      showToast('Pick or type a folder name first');
      return;
    }

    const btn = document.getElementById('hold-confirm-btn');
    btn.disabled = true; btn.textContent = 'Holding...';

    const totalAmount = items.reduce((sum, i) => sum + i.qty * getUnitPrice(i.product), 0);
    const cartData = items.map(i => ({ productId: i.product.id, qty: i.qty }));

    const { error } = await sb.from('held_bills').insert({
      shop_id: profile.shop_id,
      folder_name: folderName,
      cart_data: cartData,
      item_count: items.length,
      total_amount: totalAmount,
      created_by: profile.id
    });

    btn.disabled = false; btn.textContent = 'Hold This Bill';

    if (error) {
      showToast('Failed to hold bill: ' + error.message);
      return;
    }

    cart = {};
    cartOrder = [];
    renderCart();
    await loadHeldBills();
    renderHoldPanel();
    showToast('Bill held in "' + folderName + '"');
  });

  window.resumeHeldBill = async function(id) {
    const held = heldBills.find(h => h.id === id);
    if (!held) return;

    if (cartOrder.length > 0) {
      if (!confirm('This will replace your current in-progress bill. Continue?')) return;
    }

    cart = {};
    cartOrder = [];
    let skipped = 0;

    held.cart_data.forEach(item => {
      const product = products.find(p => p.id === item.productId);
      if (!product) { skipped++; return; }
      cart[product.id] = { product, qty: item.qty };
      cartOrder.push(product.id);
    });

    await sb.from('held_bills').delete().eq('id', id);
    await loadHeldBills();

    renderCart();
    closeHoldPanel();
    showToast(skipped > 0 ? `Bill resumed (${skipped} item(s) no longer available)` : 'Bill resumed');
  };

  window.deleteHeldBill = async function(id) {
    if (!confirm('Delete this held bill? This cannot be undone.')) return;
    await sb.from('held_bills').delete().eq('id', id);
    await loadHeldBills();
    renderHoldPanel();
  };

  // Ctrl+H opens/closes the Hold panel
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && (e.key === 'h' || e.key === 'H')) {
      e.preventDefault();
      holdOverlay.classList.contains('open') ? closeHoldPanel() : openHoldPanel();
    }
  });

  function updateCartBar() {
    const items = cartOrder.map(id => cart[id]).filter(Boolean);
    const totalQty = items.reduce((sum, i) => sum + i.qty, 0);
    const totalAmount = items.reduce((sum, i) => sum + i.qty * getUnitPrice(i.product), 0);

    document.getElementById('cart-info').textContent = totalQty.toFixed(totalQty % 1 === 0 ? 0 : 2) + ' item' + (totalQty !== 1 ? 's' : '');
    document.getElementById('cart-total').textContent = '৳' + totalAmount.toFixed(2);
    document.getElementById('charge-btn').disabled = items.length === 0;
  }

  // ---------- Checkout ----------
  document.getElementById('charge-btn').addEventListener('click', () => {
    const items = cartOrder.map(id => cart[id]).filter(Boolean);
    const totalAmount = items.reduce((sum, i) => sum + i.qty * getUnitPrice(i.product), 0);
    document.getElementById('modal-total').textContent = '৳' + totalAmount.toFixed(2);
    document.getElementById('modal-overlay').classList.add('open');
  });
  document.getElementById('cancel-link').addEventListener('click', (e) => {
    e.preventDefault();
    document.getElementById('modal-overlay').classList.remove('open');
  });

  document.querySelectorAll('.pay-opt').forEach(opt => {
    opt.addEventListener('click', () => {
      document.querySelectorAll('.pay-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      selectedPayment = opt.dataset.method;
    });
  });

  document.getElementById('confirm-btn').addEventListener('click', async () => {
    const btn = document.getElementById('confirm-btn');
    const msg = document.getElementById('charge-msg');
    btn.disabled = true; btn.textContent = 'Processing...';

    const items = cartOrder.map(id => cart[id]).filter(Boolean);
    const totalAmount = items.reduce((sum, i) => sum + i.qty * getUnitPrice(i.product), 0);

    const { data: invoice, error: invError } = await sb
      .from('invoices')
      .insert({
        shop_id: profile.shop_id,
        created_by: profile.id,
        total_amount: totalAmount,
        payment_method: selectedPayment
      })
      .select()
      .single();

    if (invError) {
      btn.disabled = false; btn.textContent = 'Confirm Payment';
      msg.textContent = 'Failed: ' + invError.message;
      msg.className = 'msg error';
      return;
    }

    const invoiceItems = items.map(i => ({
      invoice_id: invoice.id,
      product_id: i.product.id,
      quantity: i.qty,
      unit_price: getUnitPrice(i.product),
      line_total: i.qty * getUnitPrice(i.product)
    }));

    const { error: itemsError } = await sb.from('invoice_items').insert(invoiceItems);

    if (itemsError) {
      btn.disabled = false; btn.textContent = 'Confirm Payment';
      msg.textContent = 'Invoice created but items failed: ' + itemsError.message;
      msg.className = 'msg error';
      return;
    }

    for (const i of items) {
      await sb.from('products')
        .update({ stock_quantity: i.product.stock_quantity - i.qty })
        .eq('id', i.product.id);
    }

    msg.textContent = 'Bill completed successfully!';
    msg.className = 'msg success';
    btn.textContent = 'Confirm Payment';

    setTimeout(() => {
      cart = {};
      cartOrder = [];
      renderCart();
      document.getElementById('modal-overlay').classList.remove('open');
      msg.className = 'msg';
      btn.disabled = false;
      loadProducts();
      document.getElementById('search').focus();
    }, 1200);
  });

  init();
</script>

</body>
</html>
